}

function statusOf(lead, now, thresholdHours) {
  if (lead.stage === "new") {
    const hours = (now - new Date(lead.time).getTime()) / 3600000;
    return hours >= thresholdHours ? "overdue" : "new";
  }
  return lead.stage;
}

function isStalePotential(lead, now) {
  if (lead.stage !== "potential") return false;
  const ref = lead.updatedAt || lead.firstContactAt || lead.time;
  return (now - new Date(ref).getTime()) / 3600000 >= STALE_POTENTIAL_HOURS;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


function dbToLead(l) {
  return {
    id: l.id,
    stt: l.stt,
    name: l.name,
    phone: l.phone,
    time: l.time,
    callNote: l.call_note || "",
    zalo: !!l.zalo,
    revenue: l.revenue,
    note: l.note || "",
    assignee: l.assignee || "Chưa phân công",
    stage: l.stage || "new",
    notPotentialReason: l.not_potential_reason || "",
    firstContactAt: l.first_contact_at,
    updatedAt: l.updated_at,
  };
}

function leadToDb(l) {
  return {
    id: l.id,
    stt: l.stt,
    name: l.name,
    phone: l.phone,
    time: l.time,
    call_note: l.callNote || "",
    zalo: !!l.zalo,
    revenue: l.revenue,
    note: l.note || "",
    assignee: l.assignee || "Chưa phân công",
    stage: l.stage || "new",
    not_potential_reason: l.notPotentialReason || "",
    first_contact_at: l.firstContactAt,
    updated_at: l.updatedAt,
  };
}

async function fetchLeadsFromDb() {
  const { data, error } = await supabaseClient
    .from("leads")
    .select("*")
    .order("time", { ascending: false });

  if (error) throw error;
  return (data || []).map(dbToLead);
}

async function loadLeads() {
  try {
    let leads = await fetchLeadsFromDb();

    // Import dữ liệu gốc đúng một lần: chỉ khi bảng leads hoàn toàn trống.
    if (leads.length === 0 && SEED_LEADS.length > 0) {
      state.saving = true;
      render();

      const rows = SEED_LEADS.map(leadToDb);
      const { error: seedError } = await supabaseClient
        .from("leads")
        .upsert(rows, { onConflict: "id", ignoreDuplicates: true });

      if (seedError) throw seedError;
      leads = await fetchLeadsFromDb();
    }

    state.leads = leads;
    state.error = "";
  } catch (e) {
    console.error("Supabase load error:", e);
    state.leads = [];
    state.error = "Không tải được dữ liệu từ Supabase.";
  } finally {
    state.loading = false;
    state.saving = false;
    render();
  }
}

async function persist() {
  // Giữ hàm này để tương thích với code cũ.
  // Mỗi thao tác hiện được lưu trực tiếp bằng INSERT/UPDATE/DELETE.
  return true;
}

async function updateLead(id, patch) {
  const oldLead = state.leads.find((l) => l.id === id);
  if (!oldLead) return;

  const nowIso = new Date().toISOString();
  const updatedLead = Object.assign({}, oldLead, patch, { updatedAt: nowIso });

  if (patch.stage && patch.stage !== "new" && !oldLead.firstContactAt) {
    updatedLead.firstContactAt = nowIso;
  }
  if (patch.stage && patch.stage !== "not_potential") {
    updatedLead.notPotentialReason = "";
  }

  // Optimistic UI
  state.leads = state.leads.map((l) => l.id === id ? updatedLead : l);
  state.saving = true;
  state.error = "";
  render();

  const { error } = await supabaseClient
    .from("leads")
    .update(leadToDb(updatedLead))
    .eq("id", id);

  state.saving = false;

  if (error) {
    console.error("Supabase update error:", error);
    state.leads = state.leads.map((l) => l.id === id ? oldLead : l);
    state.error = "Không lưu được thay đổi.";
  }

  render();
}

async function deleteLead(id) {
  const oldLead = state.leads.find((l) => l.id === id);
  if (!oldLead) return;

  state.leads = state.leads.filter((l) => l.id !== id);
  state.saving = true;
  state.error = "";
  render();

  const { error } = await supabaseClient
    .from("leads")
    .delete()
    .eq("id", id);

  state.saving = false;

  if (error) {
    console.error("Supabase delete error:", error);
    state.leads = [oldLead, ...state.leads].sort((a, b) => new Date(b.time) - new Date(a.time));
    state.error = "Không xoá được khách.";
  }

  render();
}

async function addLead() {
  if (!state.newLead.name.trim() || !state.newLead.phone.trim()) {
    state.error = "Nhập tên và số điện thoại trước đã.";
    render();
    return;
  }

  const nowIso = new Date().toISOString();
  const lead = {
    id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "manual-" + Date.now(),
    stt: Math.max(0, ...state.leads.map((l) => Number(l.stt) || 0)) + 1,
    name: state.newLead.name.trim(),
    time: nowIso,
    phone: state.newLead.phone.trim(),
    stage: "new",
    callNote: "",
    zalo: false,
    revenue: null,
    note: "",
    notPotentialReason: "",
    firstContactAt: null,
    updatedAt: nowIso,
    assignee: state.newLead.assignee,
  };

  state.saving = true;
  state.error = "";
  render();

  const { error } = await supabaseClient
    .from("leads")
    .insert(leadToDb(lead));

  state.saving = false;

  if (error) {
    console.error("Supabase insert error:", error);
    state.error = "Không thêm được khách.";
    render();
    return;
  }

  state.leads = [lead, ...state.leads];
  state.newLead = { name: "", phone: "", assignee: "Chưa phân công" };
  state.showAddModal = false;
  state.error = "";
  render();
}

function leadsInSelectedMonth() {
  if (!state.monthFilter) return state.leads;
  return state.leads.filter((lead) => localMonthKey(lead.time) === state.monthFilter);
}

function computeStats() {
  const leads = leadsInSelectedMonth();
  const now = state.now, th = state.thresholdHours;
  const withStatus = leads.map((l) => statusOf(l, now, th));
  const total = leads.length;
  const overdue = withStatus.filter((s) => s === "overdue").length;
  const newCount = withStatus.filter((s) => s === "new").length;
  const contacted = withStatus.filter((s) => s === "contacted").length;
  const reached = leads.filter((l) => l.stage !== "new").length;
  const potential = withStatus.filter((s) => s === "potential").length;
  const notPotential = withStatus.filter((s) => s === "not_potential").length;
  const judged = potential + notPotential;
  const potentialRate = judged ? Math.round((potential / judged) * 100) : 0;
  const contactRate = total ? Math.round((reached / total) * 100) : 0;
  const stalePotential = leads.filter((l) => isStalePotential(l, now)).length;
  return {
    total, overdue, newCount, contacted, reached, potential, notPotential, judged,
    potentialRate, contactRate, stalePotential,
    byStatus: { all: total, overdue, new: newCount, contacted, potential, not_potential: notPotential },
  };
}

function filteredLeads() {
  const q = state.query.trim().toLowerCase();
  return leadsInSelectedMonth()
    .filter((l) => {
      const st = statusOf(l, state.now, state.thresholdHours);
      if (state.filter !== "all" && st !== state.filter) return false;
      if (state.assigneeFilter !== "all" && (l.assignee || "Chưa phân công") !== state.assigneeFilter) return false;
      if (q) {
        const hay = (l.name + " " + normalizePhone(l.phone)).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => new Date(b.time) - new Date(a.time));
}

function startTableEdit(cell) {
  if (!cell || cell.classList.contains("editing")) return;

  const id = cell.dataset.leadId;
  const field = cell.dataset.editField;
  const lead = state.leads.find((l) => l.id === id);
  if (!lead || !field) return;

  const originalHtml = cell.innerHTML;
  const originalValue = lead[field];

  cell.classList.add("editing");

  let editor;

  if (field === "stage") {
    editor = document.createElement("select");
    editor.className = "table-edit-select";
    ["new", "contacted", "potential", "not_potential"].forEach((key) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = STAGE_LABELS[key];
      opt.selected = lead.stage === key;
      editor.appendChild(opt);
    });
  } else if (field === "assignee") {
    editor = document.createElement("select");
    editor.className = "table-edit-select";
    ASSIGNEES.forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      opt.selected = (lead.assignee || "Chưa phân công") === name;
      editor.appendChild(opt);
    });
  } else if (field === "zalo") {
    editor = document.createElement("input");
    editor.type = "checkbox";
    editor.className = "table-edit-check";
    editor.checked = !!lead.zalo;
  } else if (field === "callNote" || field === "note") {
    editor = document.createElement("textarea");
    editor.className = "table-edit-textarea";
    editor.value = lead[field] || "";
  } else {
    editor = document.createElement("input");
    editor.type = "text";
    editor.className = "table-edit-input";
    editor.value = lead[field] == null ? "" : String(lead[field]);
  }

  cell.innerHTML = "";
  cell.appendChild(editor);
  editor.focus();

  if (editor.select && field !== "stage" && field !== "assignee") {
    try { editor.select(); } catch (e) {}
  }

  let finished = false;

  const finish = async (save) => {
    if (finished) return;
    finished = true;

    if (!save) {
      cell.classList.remove("editing");
      cell.innerHTML = originalHtml;
      return;
    }

    let value;
    if (field === "zalo") {
      value = !!editor.checked;
    } else {
      value = editor.value;
    }

    if (field === "name" && !String(value).trim()) {
      value = originalValue;
    }

    cell.classList.remove("editing");

    // updateLead sẽ render lại bảng và lưu Supabase.
    await updateLead(id, { [field]: value });
  };

  editor.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      finish(false);
    } else if (e.key === "Enter" && field !== "callNote" && field !== "note") {
      e.preventDefault();
      finish(true);
    } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && (field === "callNote" || field === "note")) {
      e.preventDefault();
      finish(true);
    }
  });

  editor.addEventListener("change", () => {
    if (field === "stage" || field === "assignee" || field === "zalo") {
      finish(true);
    }
  });

  editor.addEventListener("blur", () => {
    setTimeout(() => finish(true), 0);
  });
}


function exportExcel() {
  try {
    if (!window.XLSX) {
      state.error = "Không tải được thư viện xuất Excel.";

    // Xuất đúng danh sách đang được lọc/tìm kiếm trên màn hình.
    const leads = filteredLeads();

    if (!leads.length) {
      state.error = "Không có dữ liệu để xuất Excel.";
      render();
      return;
    }

    const rows = leads.map((lead, index) => {
      const st = statusOf(lead, state.now, state.thresholdHours);
      const statusLabel = st === "overdue" ? "Trễ hạn" : STAGE_LABELS[lead.stage];

      return {
        "STT": lead.stt || index + 1,
        "Ngày nhận": fmtFullDateTime(lead.time),
        "Khách hàng": String(lead.name || "").trim(),
        "Số điện thoại": normalizePhone(lead.phone),
        "Trạng thái": statusLabel,
        "BD phụ trách": lead.assignee || "Chưa phân công",
        "Đã tư vấn Zalo": lead.zalo ? "Có" : "Không",
        "Doanh số dự kiến": lead.revenue || "",
        "Ghi chú cuộc gọi": lead.callNote || "",
        "Ghi chú khác": lead.note || "",

        "Cập nhật gần nhất": fmtFullDateTime(lead.updatedAt),
      };
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [
      { wch: 8 }, { wch: 18 }, { wch: 28 }, { wch: 16 }, { wch: 18 },
      { wch: 18 }, { wch: 16 }, { wch: 18 }, { wch: 45 }, { wch: 35 },
      { wch: 28 }, { wch: 20 }, { wch: 20 },
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Leads");

    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");

    XLSX.writeFile(wb, "CNC_BD_Leads_" + y + m + d + "_" + hh + mm + ".xlsx");
    state.error = "";
  } catch (e) {
    console.error("Export Excel error:", e);
    state.error = "Xuất Excel thất bại.";
    render();
  }
}

    '<div class="ai-welcome">Tôi có thể phân tích dữ liệu <b>' + escapeHtml(monthLabel(state.monthFilter)) +
    '</b>. Số điện thoại không được gửi sang AI.' +
      '<div class="ai-suggestions">' +
        '<button class="ai-suggestion" data-action="ai-suggestion" data-question="Tóm tắt tình hình tháng này và việc cần ưu tiên">Tóm tắt tháng</button>' +
        '<button class="ai-suggestion" data-action="ai-suggestion" data-question="Khách tiềm năng nào cần follow-up trước?">Ưu tiên follow-up</button>' +
        '<button class="ai-suggestion" data-action="ai-suggestion" data-question="Đánh giá hiệu quả của từng BD trong tháng">Hiệu quả BD</button>' +
      "</div>" +
    "</div>";

  return '<section class="ai-panel" aria-label="Trợ lý AI CRM">' +
    '<div class="ai-head"><div><h2>Trợ lý AI CRM</h2><p>DeepSeek · ' + escapeHtml(monthLabel(state.monthFilter)) + '</p></div>' +
      '<button class="ai-close" data-action="close-ai" aria-label="Đóng">' + icon("x", 16) + "</button></div>" +
    '<div class="ai-messages" id="ai-messages">' + welcome + messages + "</div>" +
    (state.aiError ? '<div class="ai-error">' + escapeHtml(state.aiError) + "</div>" : "") +
    '<div class="ai-form"><textarea class="ai-input" id="ai-input" rows="1" placeholder="Ví dụ: Tháng này có bao nhiêu khách tiềm năng?"' + (state.aiLoading ? " disabled" : "") + ">" + escapeHtml(state.aiDraft) + "</textarea>" +
      '<button class="ai-send" data-action="send-ai" aria-label="Gửi câu hỏi"' + (state.aiLoading ? " disabled" : "") + ">" + (state.aiLoading ? icon("loader", 16, 'class="spin"') : icon("send", 16)) + "</button>" +
    "</div>" +
  "</section>";
}

function aiContext() {
  const stats = computeStats();
  const scopedLeads = leadsInSelectedMonth()
    .slice()
    .sort((a, b) => new Date(b.time) - new Date(a.time));
  const leads = scopedLeads
    .slice(0, 120)
    .map((lead) => ({
      name: String(lead.name || "").trim(),
      receivedAt: lead.time,
      status: statusOf(lead, state.now, state.thresholdHours) === "overdue" ? "Trễ hạn" : STAGE_LABELS[lead.stage],
      assignee: lead.assignee || "Chưa phân công",
      revenue: lead.revenue || "",
      callNote: String(lead.callNote || "").slice(0, 250),
      note: String(lead.note || "").slice(0, 250),
      updatedAt: lead.updatedAt,
    }));

  return {
    period: monthLabel(state.monthFilter),
    generatedAt: new Date().toISOString(),
    reminderThresholdHours: state.thresholdHours,
    stats: {
      total: stats.total,
      overdue: stats.overdue,
      new: stats.newCount,
      contacted: stats.contacted,
      reached: stats.reached,
      potential: stats.potential,
      notPotential: stats.notPotential,
      contactRate: stats.contactRate,
      potentialRate: stats.potentialRate,
    },
    leads,
    leadCoverage: {
      included: leads.length,
      total: scopedLeads.length,
      rule: "Tối đa 120 khách mới nhất trong kỳ; số thống kê luôn tính trên toàn bộ khách trong kỳ.",
    },
    privacy: "Số điện thoại đã được loại khỏi dữ liệu gửi sang AI.",
  };
}

function scrollAiToBottom() {
  const box = document.getElementById("ai-messages");
  if (box) box.scrollTop = box.scrollHeight;
}

async function sendAiQuestion(questionOverride) {
  const question = String(questionOverride || state.aiDraft || "").trim();
  if (!question || state.aiLoading) return;

  state.aiDraft = "";
  state.aiError = "";
  state.aiLoading = true;
  state.aiMessages.push({ role: "user", content: question });
  state.aiMessages.push({ role: "assistant", content: "" });
  const assistantIndex = state.aiMessages.length - 1;
  render();
  requestAnimationFrame(scrollAiToBottom);

  try {
    const response = await fetch(SUPABASE_URL + "/functions/v1/crm-ai", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
      },
      body: JSON.stringify({
        messages: state.aiMessages.filter((message) => message.content).slice(-8),
        context: aiContext(),
      }),
    });

    if (!response.ok) {
      let message = "AI chưa sẵn sàng. Hãy kiểm tra Edge Function và secret DeepSeek.";
      try {
        const payload = await response.json();
        if (payload && payload.error) message = payload.error;
      } catch (e) {}
      throw new Error(message);
    }
    if (!response.body) throw new Error("Trình duyệt không nhận được luồng trả lời từ AI.");

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let done = false;

    while (!done) {
      const chunk = await reader.read();
      done = chunk.done;
      buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          const text = parsed.choices?.[0]?.delta?.content || "";
          if (!text) continue;
          state.aiMessages[assistantIndex].content += text;
          const bubble = document.querySelector('[data-ai-message-index="' + assistantIndex + '"]');
          if (bubble) bubble.textContent = state.aiMessages[assistantIndex].content;
          scrollAiToBottom();
        } catch (e) {}
      }
    }

    if (!state.aiMessages[assistantIndex].content) {
      throw new Error("AI không trả về nội dung.");
    }
  } catch (error) {
    console.error("CRM AI error:", error);
    if (!state.aiMessages[assistantIndex].content) state.aiMessages.splice(assistantIndex, 1);
    state.aiError = error && error.message ? error.message : "Không thể kết nối tới AI.";
  } finally {
    state.aiLoading = false;
    render();
    requestAnimationFrame(scrollAiToBottom);
  }
}

function render() {
  const root = document.getElementById("app-root");

  // Giữ nguyên vị trí cuộn của danh sách khi render lại.
  const oldList = root.querySelector(".list, .table-wrap");
  const previousListScrollTop = oldList ? oldList.scrollTop : 0;
  const previousListScrollLeft = oldList ? oldList.scrollLeft : 0;

  if (state.loading || !state.leads) {
    root.innerHTML = '<div class="loading-wrap">' + icon("loader", 18, 'class="spin"') + " Đang tải dữ liệu...</div>";
    return;
  }

  const stats = computeStats();
  const list = filteredLeads();

  const tabs = [
    ["all", "Tất cả"], ["overdue", "Trễ hạn"], ["new", "Chưa tiếp cận"],
    ["contacted", "Đã tiếp cận"], ["potential", "Tiềm năng"], ["not_potential", "Không tiềm năng"],
  ].map(([key, label]) => '<button class="tab ' + (state.filter === key ? "active" : "") + '" data-action="set-filter" data-filter="' + key + '">' + label + '<span class="tab-count">' + stats.byStatus[key] + "</span></button>").join("");

  const staleBanner = stats.stalePotential > 0
    ? '<div class="stale-banner">' + icon("clock", 13) + stats.stalePotential + " khách tiềm năng chưa cập nhật quá " + STALE_POTENTIAL_HOURS + "h — nên follow-up trước khi nguội.</div>"
    : "";

  const rowsHtml = list.length
    ? list.map(renderRow).join("")
    : '<div class="empty-state">Không có khách nào khớp bộ lọc.</div>';

  const dataViewHtml = state.viewMode === "table"
    ? renderTable(list)
    : '<div class="list">' + rowsHtml + "</div>";

  root.innerHTML =
    '<div class="header">' +
      '<div class="header-top">' +
        '<div><h1>CNC · Theo dõi cuộc gọi BD</h1><p class="subtitle">Khách để lại SĐT trên Facebook · dữ liệu dùng chung cả team</p></div>' +
        '<div class="save-status">' + (state.saving ? icon("loader", 12, 'class="spin"') + " Đang lưu" : icon("check", 12) + " Đã lưu") + "</div>" +
      "</div>" +
      '<div class="period-bar">' +
        '<div class="period-copy"><p class="period-title">' + escapeHtml(monthLabel(state.monthFilter)) + '</p><p class="period-subtitle">Số liệu và trạng thái bên dưới đang tính theo kỳ này</p></div>' +
        '<div class="period-controls"><input class="month-input" id="month-filter" type="month" value="' + escapeHtml(state.monthFilter) + '" />' +
          '<button class="period-all-btn ' + (!state.monthFilter ? "active" : "") + '" data-action="all-months">Tất cả tháng</button></div>' +
      "</div>" +
      '<div class="stat-grid">' +
        '<div class="stat-card"><p class="stat-label">Tổng số</p><p class="stat-value">' + stats.total + "</p></div>" +
        '<div class="stat-card"><p class="stat-label">Trễ hạn</p><p class="stat-value">' + stats.overdue + "</p></div>" +
        '<div class="stat-card"><p class="stat-label">Chưa tiếp cận</p><p class="stat-value">' + stats.newCount + "</p></div>" +
        '<div class="stat-card"><p class="stat-label">Đã tiếp cận</p><p class="stat-value">' + stats.contacted + "</p></div>" +
        '<div class="stat-card"><p class="stat-label">Tiềm năng</p><p class="stat-value">' + stats.potential + "</p></div>" +
        '<div class="stat-card"><p class="stat-label">Không tiềm năng</p><p class="stat-value">' + stats.notPotential + "</p></div>" +
      "</div>" +
      '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:' + stats.contactRate + '%"></div></div><span class="progress-label">' + stats.contactRate + "% đã tiếp cận</span></div>" +
      '<p class="insight-line">Trong số khách đã đánh giá, <b>' + stats.potentialRate + "%</b> là tiềm năng (" + stats.potential + "/" + stats.judged + ").</p>" +
      staleBanner +
    "</div>" +
    '<div class="edit-hint-bar">Double click để chỉnh sửa thông tin</div>' +
    '<div class="toolbar">' +
      '<div class="tabs">' + tabs + "</div>" +
      '<div class="search-wrap">' + icon("search", 14) + '<input class="search-input" id="search-input" placeholder="Tìm tên hoặc số điện thoại" value="' + escapeHtml(state.query) + '" /></div>' +
      '<select id="assignee-filter">' + '<option value="all"' + (state.assigneeFilter === "all" ? " selected" : "") + '>Tất cả BD</option>' + optionsHtml(ASSIGNEES, state.assigneeFilter === "all" ? null : state.assigneeFilter) + "</select>" +
      '<select id="threshold-select">' +
        [12, 24, 48, 72].map((h) => '<option value="' + h + '"' + (state.thresholdHours === h ? " selected" : "") + '>Nhắc sau ' + h + "h</option>").join("") +
      "</select>" +
      '<button class="btn-view ' + (state.viewMode === "table" ? "active" : "") + '" data-action="toggle-view">' +
        icon(state.viewMode === "table" ? "list" : "table", 14) +
        (state.viewMode === "table" ? " Danh sách" : " Dạng bảng") +
      "</button>" +
      '<button class="btn-export" data-action="export-excel">' + icon("download", 14) + " Xuất Excel</button>" +
      '<button class="btn-primary" data-action="open-add-modal">' + icon("plus", 14) + " Thêm khách</button>" +
    "</div>" +
    (state.error ? '<div class="error-banner">' + escapeHtml(state.error) + "</div>" : "") +
    dataViewHtml +
    '<div class="modal-overlay ' + (state.showAddModal ? "open" : "") + '" id="modal-overlay">' +
      '<div class="modal">' +
        '<div class="modal-head"><h3>Thêm khách mới</h3><button class="modal-close" data-action="close-add-modal">' + icon("x", 16) + "</button></div>" +
        '<div class="modal-field"><label class="field-label">Tên khách</label><input class="text-field" id="new-name" placeholder="Tên hoặc nick Facebook" value="' + escapeHtml(state.newLead.name) + '" /></div>' +
        '<div class="modal-field"><label class="field-label">Số điện thoại</label><input class="text-field" id="new-phone" placeholder="09xxxxxxxx" value="' + escapeHtml(state.newLead.phone) + '" /></div>' +
        '<div class="modal-field"><label class="field-label">Phân công</label><select id="new-assignee" style="width:100%;margin-top:4px;">' + optionsHtml(ASSIGNEES, state.newLead.assignee) + "</select></div>" +
        '<button class="modal-submit" data-action="submit-add">' + icon("plus", 15) + " Thêm vào danh sách</button>" +
      "</div>" +
    "</div>" +
    renderAiHtml();

  attachDynamicListeners();

  // Khôi phục vị trí cuộn sau khi toàn bộ innerHTML được dựng lại.
  const newList = root.querySelector(".list, .table-wrap");
  if (newList) {
    newList.scrollTop = previousListScrollTop;
    newList.scrollLeft = previousListScrollLeft;
  }
}

function attachDynamicListeners() {
  const search = document.getElementById("search-input");
  if (search) {
    search.oninput = (e) => { state.query = e.target.value; renderListOnly(); };
  }
  const assigneeFilter = document.getElementById("assignee-filter");
  if (assigneeFilter) assigneeFilter.onchange = (e) => { state.assigneeFilter = e.target.value; render(); };
  const monthFilter = document.getElementById("month-filter");
  if (monthFilter) monthFilter.onchange = (e) => {
    state.monthFilter = e.target.value;
    state.filter = "all";
    state.aiMessages = [];
    state.aiError = "";
    render();
  };
  const thresholdSelect = document.getElementById("threshold-select");
  if (thresholdSelect) thresholdSelect.onchange = (e) => { state.thresholdHours = Number(e.target.value); render(); };
  const aiInput = document.getElementById("ai-input");
  if (aiInput) {
    aiInput.oninput = (e) => { state.aiDraft = e.target.value; };
    aiInput.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        state.aiDraft = e.target.value;
        sendAiQuestion();
      }
    };
  }
  const newName = document.getElementById("new-name");
  if (newName) newName.oninput = (e) => { state.newLead.name = e.target.value; };
  const newPhone = document.getElementById("new-phone");
  if (newPhone) newPhone.oninput = (e) => { state.newLead.phone = e.target.value; };
  const newAssignee = document.getElementById("new-assignee");
  if (newAssignee) newAssignee.onchange = (e) => { state.newLead.assignee = e.target.value; };
  if (state.aiOpen && state.aiMessages.length) requestAnimationFrame(scrollAiToBottom);
}

function renderListOnly() {
  render();
  const search = document.getElementById("search-input");
  if (search) { search.focus(); const v = search.value; search.value = ""; search.value = v; }
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) {
    if (e.target.id === "modal-overlay") { state.showAddModal = false; render(); }
    return;
  }
  const action = t.dataset.action;
  const id = t.dataset.id;
  if (action === "set-filter") { state.filter = t.dataset.filter; render(); }
  else if (action === "all-months") {
    state.monthFilter = "";
    state.filter = "all";
    state.aiMessages = [];
    state.aiError = "";
    render();
  }
  else if (action === "open-ai") { state.aiOpen = true; render(); }
  else if (action === "close-ai") { state.aiOpen = false; render(); }
  else if (action === "ai-suggestion") { sendAiQuestion(t.dataset.question); }
  else if (action === "send-ai") { sendAiQuestion(); }
  else if (action === "export-excel") { exportExcel(); }
  else if (action === "toggle-view") {
    state.viewMode = state.viewMode === "list" ? "table" : "list";
    state.expandedId = null;
    render();
  }
  else if (action === "toggle-expand") {
    state.expandedId = state.expandedId === id ? null : id;
    render();

    // Nếu phần chi tiết vừa mở bị khuất, chỉ cuộn vừa đủ để giữ lead đang xem trong khung.
    requestAnimationFrame(() => {
      const trigger = document.querySelector('[data-action="toggle-expand"][data-id="' + id + '"]');
      const row = trigger ? trigger.closest(".row") : null;
      const list = document.querySelector(".list");
      if (!row || !list) return;

      const rowRect = row.getBoundingClientRect();
      const listRect = list.getBoundingClientRect();

      if (rowRect.bottom > listRect.bottom) {
        list.scrollTop += rowRect.bottom - listRect.bottom + 12;
      } else if (rowRect.top < listRect.top) {
        list.scrollTop -= listRect.top - rowRect.top + 12;
      }
    });
  }
  else if (action === "set-stage") { updateLead(id, { stage: t.dataset.stage }); }
  else if (action === "set-reason") { updateLead(id, { notPotentialReason: t.dataset.reason }); }
  else if (action === "delete") { deleteLead(id); }
  else if (action === "copy-phone") { copyPhone(id, t.dataset.phone); }
  else if (action === "open-add-modal") { state.showAddModal = true; render(); }
  else if (action === "close-add-modal") { state.showAddModal = false; render(); }
  else if (action === "submit-add") { addLead(); }
});

document.addEventListener("dblclick", (e) => {
  const cell = e.target.closest("td[data-edit-field][data-lead-id]");
  if (!cell || state.viewMode !== "table") return;
  e.preventDefault();
  startTableEdit(cell);
});

document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const id = t.dataset.id;
  if (t.dataset.action === "toggle-zalo") updateLead(id, { zalo: t.checked });
  else if (t.dataset.action === "set-assignee") updateLead(id, { assignee: t.value });
});

document.addEventListener("blur", (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.action) return;
  const id = t.dataset.id;
  if (t.dataset.action === "set-callnote") updateLead(id, { callNote: t.value });
  else if (t.dataset.action === "set-revenue") updateLead(id, { revenue: t.value });
  else if (t.dataset.action === "set-note") updateLead(id, { note: t.value });
}, true);


let realtimeReloadTimer = null;

supabaseClient
  .channel("cnc-bd-leads-realtime")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "leads" },
    () => {
      clearTimeout(realtimeReloadTimer);
      realtimeReloadTimer = setTimeout(async () => {
        try {
          state.leads = await fetchLeadsFromDb();
          state.error = "";
          render();
        } catch (e) {
          console.error("Realtime refresh error:", e);
        }
      }, 250);
    }
  )
  .subscribe();

setInterval(() => { state.now = Date.now(); render(); }, 60000);

loadLeads();
</script>
